services:
  postgres:
    image: postgres:16-alpine
    container_name: krissquest_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: krissquest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - krissquest_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro

volumes:
  krissquest_pgdata:

